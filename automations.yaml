- id: '1795649569877'
  alias: Heizung Nachtabsenkung
  description: Senkt Schlafzimmer, Kinderzimmer und Wohnzimmer um 22:30 auf 17 °C
    und stellt werktags um 06:30 die gespeicherte Tagestemperatur wieder her. Ein
    Thermostat, das aus ist, bleibt aus.
  triggers:
  - at: '22:30:00'
    id: night
    trigger: time
  - at: 06:30:00
    id: morning
    trigger: time
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: night
    - condition: time
      weekday:
      - mon
      - tue
      - wed
      - thu
      - fri
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: night
      sequence:
      - if:
        - condition: state
          entity_id: climate.schlafzimmer
          state: heat
        - above: 17.5
          attribute: temperature
          condition: numeric_state
          entity_id: climate.schlafzimmer
        then:
        - action: input_number.set_value
          data:
            value: '{{ state_attr(''climate.schlafzimmer'', ''temperature'') }}'
          target:
            entity_id: input_number.tagestemperatur_schlafzimmer
        - action: climate.set_temperature
          data:
            temperature: 17
          target:
            entity_id: climate.schlafzimmer
      - if:
        - condition: state
          entity_id: climate.kinderzimmer
          state: heat
        - above: 17.5
          attribute: temperature
          condition: numeric_state
          entity_id: climate.kinderzimmer
        then:
        - action: input_number.set_value
          data:
            value: '{{ state_attr(''climate.kinderzimmer'', ''temperature'') }}'
          target:
            entity_id: input_number.tagestemperatur_kinderzimmer
        - action: climate.set_temperature
          data:
            temperature: 17
          target:
            entity_id: climate.kinderzimmer
      - if:
        - condition: state
          entity_id: climate.wohnzimmer_heizung_wohnzimmer
          state: heat
        - above: 17.5
          attribute: temperature
          condition: numeric_state
          entity_id: climate.wohnzimmer_heizung_wohnzimmer
        then:
        - action: input_number.set_value
          data:
            value: '{{ state_attr(''climate.wohnzimmer_heizung_wohnzimmer'', ''temperature'')
              }}'
          target:
            entity_id: input_number.tagestemperatur_wohnzimmer
        - action: climate.set_temperature
          data:
            temperature: 17
          target:
            entity_id: climate.wohnzimmer_heizung_wohnzimmer
    - conditions:
      - condition: trigger
        id: morning
      sequence:
      - if:
        - condition: state
          entity_id: climate.schlafzimmer
          state: heat
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ states(''input_number.tagestemperatur_schlafzimmer'')
              | float(19) }}'
          target:
            entity_id: climate.schlafzimmer
      - if:
        - condition: state
          entity_id: climate.kinderzimmer
          state: heat
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ states(''input_number.tagestemperatur_kinderzimmer'')
              | float(19.5) }}'
          target:
            entity_id: climate.kinderzimmer
      - if:
        - condition: state
          entity_id: climate.wohnzimmer_heizung_wohnzimmer
          state: heat
        then:
        - action: climate.set_temperature
          data:
            temperature: '{{ states(''input_number.tagestemperatur_wohnzimmer'') |
              float(22) }}'
          target:
            entity_id: climate.wohnzimmer_heizung_wohnzimmer
  mode: single
