- id: '1795645967935'
  alias: Büro heizen im Homeoffice
  description: Weekdays at 08:00, if the Google working location is Home and the work
    calendar has no Out of office, and the office is below 19°C, turn on the office
    fan heater and the floor heating.
  triggers:
  - at: 08:00:00
    note: Once each morning. The weekday filter is a condition so Saturday and Sunday
      do nothing.
    trigger: time
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
  - below: 19
    condition: numeric_state
    entity_id: sensor.thermometer_buro_temperatur
    note: Office thermometer. An unavailable reading is false, so the heaters stay
      off.
  actions:
  - action: calendar.get_events
    data:
      duration:
        hours: 24
      start_date_time: '{{ today_at(''00:00'') }}'
    response_variable: agenda
    target:
      entity_id:
      - calendar.arbeitsort
      - calendar.jan_dieter_kastner_ext_veolia_com
  - if:
    - '{% set locations = agenda[''calendar.arbeitsort''].events | default([]) %}

      {% set work = agenda[''calendar.jan_dieter_kastner_ext_veolia_com''].events
      | default([]) %}

      {% set ns = namespace(home=false, ooo=false) %}

      {% for event in locations %}

      {% set summary = (event.summary | default('''')) | lower %}

      {% if summary in [''home'', ''zuhause''] %}

      {% set ns.home = true %}

      {% endif %}

      {% endfor %}

      {% for event in work %}

      {% set summary = (event.summary | default('''')) | lower %}

      {% if ''out of office'' in summary or ''abwesend'' in summary %}

      {% set ns.ooo = true %}

      {% endif %}

      {% endfor %}

      {{ ns.home and not ns.ooo }}'
    then:
    - action: switch.turn_on
      target:
        entity_id:
        - switch.smart_heater_buro
        - switch.tz3000_w0qqde0g_ts011f_6
  mode: single
- id: '1795649011295'
  alias: Matrix nach Kalender
  description: While the office light is on and Jan's iPhone is home, show Do not
    disturb during a Veolia calendar event and the welcome text when that calendar
    is clear.
  triggers:
  - trigger: state
    entity_id: light.tz3000_hafsqare_ts0011
    to: 'on'
    id: in_office
    note: Office light coming on is one half of being at the desk.
  - trigger: state
    entity_id: device_tracker.jdk_iphone_16
    to: home
    id: in_office
    note: Companion-app tracker that currently locates Jan.
  - trigger: calendar
    entity_id: calendar.jan_dieter_kastner_ext_veolia_com
    event: start
    id: event_start
  - trigger: calendar
    entity_id: calendar.jan_dieter_kastner_ext_veolia_com
    event: end
    id: event_end
  - trigger: homeassistant
    event: start
    id: restart
  conditions:
  - condition: state
    entity_id: light.tz3000_hafsqare_ts0011
    state: 'on'
  - condition: state
    entity_id: device_tracker.jdk_iphone_16
    state: home
  actions:
  - if:
    - condition: trigger
      id: event_end
    then:
    - delay:
        seconds: 5
      note: Let the calendar state settle so an overlapping event stays on Do not
        disturb.
  - if:
    - condition: or
      conditions:
      - condition: trigger
        id: event_start
      - condition: state
        entity_id: calendar.jan_dieter_kastner_ext_veolia_com
        state: 'on'
    then:
    - action: script.awtrix_set_to_dnd
    else:
    - action: script.awtrix_set_to_welcome
  mode: queued
  max: 5
